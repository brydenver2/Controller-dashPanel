# balena.yml — fleet / application manifest for Controller-dashPanel (njsPC dashboard)
# Loaded by `balena push <fleet>` or by open-balena on self-hosted fleets.
# Reference: https://docs.balena.io/reference/balena.yml/
#
# Mirrors the AQB-011 pattern from ultron-aquabutler/poolController/balena.yml.
# Single-service application: dashPanel serves only the web UI and proxies
# state to a sibling njsPC over the local balena network. No MQTT, no RS-485,
# no DB on this device — keep the CPE image lean.

# The balena base image used for the build stage. Must match the target fleet's
# architecture. balenalib images are produced for every supported device type
# and include the native build toolchain (gcc, python, linux-headers) needed
# to compile native deps (ssdp, etc.).
buildkit:
  # Compose-style network so the GHCR base image can be pulled during build.
  network: host

# Images built by `balena build` are tagged into this image registry path.
# Bryan normally pushes to ghcr.io/ultron-aquabutler — balena ignores this if
# pushing into the balena/balena-cloud registry instead.
images:
  application: ghcr.io/ultron-aquabutler/njspc-dash
  # Optional: pin a fleet-specific tag here when open-balena is in use.

# Single-service application. dashPanel serves only the HTTP(S) UI; the pool
# controller it talks to runs on a sibling device (or the same fleet's
# poolController service) and is reached over the balena-managed LAN.
services:
  dashPanel:
    # Build context = repo root; use the existing multi-stage Dockerfile.
    build:
      context: .
      dockerfile: Dockerfile
      # Build-args surfaced so balena OS / arch specific tweaks can happen
      # without forking the Dockerfile per device.
      args:
        - NODE_VERSION=20
    # Public hostname balena assigns in the device dashboard / local DNS.
    hostname: dashpanel
    # Run as the unprivileged `node` user (matches Dockerfile USER node).
    user: node
    # Keep running across crashes; supervisor restarts on exit.
    restart: always
    # Expose UI + optional HTTPS on the device's LAN.
    # 5150 = defaultConfig.web.servers.http.port
    # 5151 = defaultConfig.web.servers.https.port (only used if config enables HTTPS)
    ports:
      - "5150:5150/tcp"   # web UI (HTTP)
      - "5151:5151/tcp"   # HTTPS (only used if config enables it)
    # Persistent data on the device's balena-supervisor volume, not the host fs.
    volumes:
      - "dashpanel-data:/app/data"
      - "dashpanel-logs:/app/logs"
      - "dashpanel-uploads:/app/uploads"
      # config.json is editable from the host via balena's file browser; bind
      # a named volume so changes survive `balena push` OTA updates.
      - "dashpanel-config:/app/config.json:rw"
    # Service-level environment variables. Bryan can override per device in
    # the balena dashboard → Device Variables. Defaults below assume a
    # dashPanel running alongside a sibling poolController on the balena LAN
    # at hostname `poolcontroller` (balena DNS resolves sibling service names).
    environment:
      # Tell dashPanel which sibling poolController to proxy to. defaultConfig
      # ships with web.services.ip=127.0.0.1 — we override to the sibling
      # hostname so the dashboard talks to the controller over the LAN, not
      # the loopback. Override per device if your controller is elsewhere.
      - "POOL_WEB_SERVICES_PROTOCOL=http://"
      - "POOL_WEB_SERVICES_IP=poolcontroller"
      - "POOL_WEB_SERVICES_PORT=4200"
      # Geolocation is site-specific; left blank here on purpose.
      # Set TZ in the balena device dashboard if your customer timezone differs.
      - "TZ=America/Phoenix"
      - "NODE_ENV=production"
    # Balena supervisor pings this URL on the device for liveness. dashPanel
    # exposes /config/appVersion?health and the dashboard HTML at GET /.
    healthcheck:
      interval: 60s
      timeout: 8s
      start_period: 45s
      retries: 4
      path: /config/appVersion?health
      port: 5150
    # Image labels — balena uses these in the fleet dashboard.
    labels:
      - "io.balena.qemu.version=8.0.0-rc8+qemu-7.2"
      - "io.balena.features.supervisor-api=1.2.0"
      - "io.balena.features.balena-api=1.2.0"
      - "io.balena.features.device-plugin=1.2.0"
      - "org.opencontainers.image.title=nodejs-poolController-dashPanel"
      - "org.opencontainers.image.description=Web dashboard for nodejs-poolController (njsPC). AqualinkD-themed UI, balena fleet build for Raspberry Pi."
      - "org.opencontainers.image.source=https://github.com/ultron-aquabutler/Controller-dashPanel"
      - "org.opencontainers.image.licenses=MIT"

# Named volumes map onto the device's persistent storage managed by
# balena-supervisor. They survive OTA updates and host reboots.
volumes:
  dashpanel-data:
  dashpanel-logs:
  dashpanel-uploads:
  dashpanel-config:

# Override device-types Bryan cares about. balena's default fleet type is
# raspberry-pi; the build will produce a manifest that works on every Pi
# family supported by balenaOS (Pi 3, 4, Zero 2 W, 5). If a future fleet
# needs Jetson Nano or amd64 gateway boxes, add deviceTypes below.
# deviceTypes:
#   - raspberrypi4-64
#   - raspberrypi3
#   - raspberrypizero2w-64
